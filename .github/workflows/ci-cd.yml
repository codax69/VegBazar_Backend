name: Backend CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Test & Verify
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build Docker Image (Verify build & PM2 packaging)
        run: docker build -t vegbazar-backend:ci .

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Production VPS
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Backend to VPS
        env:
          RAW_HOST: ${{ secrets.VPS_HOST }}
          RAW_USER: ${{ secrets.VPS_USERNAME }}
          RAW_TARGET: ${{ secrets.VPS_BACKEND_TARGET_DIR || secrets.VPS_TARGET_DIR }}
        run: |
          HOST=$(echo "$RAW_HOST" | tr -d '\r\n\t ' | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||')
          USER=$(echo "$RAW_USER" | tr -d '\r\n\t ')
          TARGET=$(echo "$RAW_TARGET" | tr -d '\r\n\t ')

          echo "Deploying backend to $USER@$HOST:$TARGET ..."

          # Sync backend files to VPS (preserve server .env)
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'tests' \
            --exclude 'temp' \
            --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ "$USER@$HOST:$TARGET"

          # Build and run with PM2 / Docker on VPS
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash -s << EOF
            set -e
            cd "$TARGET"

            if command -v docker >/dev/null 2>&1 && [ -f Dockerfile ]; then
              echo "=== Stage 1: Build Docker Image on Server ==="
              docker build -t vegbazar-backend:latest .

              echo "=== Stage 2: Run Docker Image with PM2 Container ==="
              docker stop vegbazar-backend 2>/dev/null || true
              docker rm vegbazar-backend 2>/dev/null || true

              # Stop native host PM2 if previously running on VPS
              if command -v pm2 >/dev/null 2>&1; then
                pm2 stop vegbazar-backend 2>/dev/null || true
                pm2 delete vegbazar-backend 2>/dev/null || true
                pm2 save 2>/dev/null || true
              fi

              # Release port 4000 if still held by another process
              if command -v fuser >/dev/null 2>&1; then
                fuser -k 4000/tcp 2>/dev/null || true
              fi

              # Ensure .env file exists on VPS
              if [ ! -f .env ]; then
                echo "WARNING: .env not found in $TARGET. Creating default placeholder .env file."
                touch .env
              fi

              docker run -d --name vegbazar-backend --restart unless-stopped \
                --env-file .env \
                -p 4000:4000 \
                vegbazar-backend:latest

              docker image prune -f
              echo "=== Docker Container Status ==="
              docker ps --filter "name=vegbazar-backend"
            elif command -v pm2 >/dev/null 2>&1; then
              echo "=== Stage: Deploy via Native PM2 ==="
              npm ci --omit=dev --prefer-offline
              pm2 startOrReload ecosystem.config.cjs --update-env || pm2 restart vegbazar-backend || pm2 start ecosystem.config.cjs
              pm2 save
              echo "=== PM2 Process Status ==="
              pm2 list
            else
              echo "=== Fallback: Run via npm ==="
              npm ci --omit=dev --prefer-offline
            fi
          EOF
