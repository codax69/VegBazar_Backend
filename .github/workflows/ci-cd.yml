name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vegbazar-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Test and verify image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate deployment script
        run: bash -n deploy.sh
      - name: Verify production Docker image
        run: |
          docker build --tag vegbazar-backend:ci .
          docker run --rm vegbazar-backend:ci node --check index.js

  publish-and-deploy:
    name: Publish and deploy backend
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    concurrency:
      group: vegbazar-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/codax69/vegbazar-backend:${{ github.sha }}
            ghcr.io/codax69/vegbazar-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy exact image tag to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" || ! "${VPS_HOST:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_HOST is missing. Add the VPS hostname or IP as a repository secret."
            exit 1
          fi
          if [[ -z "${VPS_USER:-}" || ! "${VPS_USER:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_USER is missing. Add the SSH username as a repository secret (VPS_USERNAME is also accepted for migration)."
            exit 1
          fi
          if [[ -z "${VPS_SSH_KEY:-}" || ! "${VPS_SSH_KEY:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_SSH_KEY is missing. Add the SSH private key as a repository secret."
            exit 1
          fi
          for file in docker-compose.yml deploy.sh; do
            if [ ! -s "$file" ]; then
              echo "::error::Required VPS deployment file is missing: $file"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/vegbazar_deploy"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H -T 10 "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Could not obtain VPS host key via ssh-keyscan and VPS_KNOWN_HOSTS is not provided."
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh_options=(
            -i "$key_file"
            -p "${VPS_PORT:-22}"
            -o LogLevel=ERROR
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          scp_options=(
            -i "$key_file"
            -P "${VPS_PORT:-22}"
            -o LogLevel=ERROR
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
          )
          destination="$VPS_USER@$VPS_HOST"
          ssh "${ssh_options[@]}" "$destination" \
            "mkdir -p /opt/apps/vegbazar/backend/.deployment-revisions && test -f /opt/apps/vegbazar/backend/.env || { echo '::error::Missing /opt/apps/vegbazar/backend/.env on VPS. Create it with DB_URI and required production secrets before deploying.' >&2; exit 1; }"
          staging_dir="/opt/apps/vegbazar/backend/.incoming-$GITHUB_SHA"
          ssh "${ssh_options[@]}" "$destination" \
            "install -d -m 700 '$staging_dir'"
          scp "${scp_options[@]}" docker-compose.yml deploy.sh \
            "$destination:$staging_dir/"
          ssh "${ssh_options[@]}" "$destination" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          commit_sha="$1"
          app_dir="/opt/apps/vegbazar/backend"
          staging_dir="$app_dir/.incoming-$commit_sha"
          revision_dir="$app_dir/.deployment-revisions/$commit_sha"

          exec 9>"$app_dir/.deploy.lock"
          flock -w 600 9 || {
            echo "Timed out waiting for the active VegBazar Backend deployment to finish." >&2
            exit 1
          }

          test -s "$staging_dir/docker-compose.yml"
          test -s "$staging_dir/deploy.sh"
          if [[ -d "$revision_dir" ]]; then
            if ! cmp -s "$staging_dir/docker-compose.yml" "$revision_dir/docker-compose.yml" ||
              ! cmp -s "$staging_dir/deploy.sh" "$revision_dir/deploy.sh"; then
              echo "The existing deployment revision does not match commit $commit_sha." >&2
              exit 1
            fi
            rm -rf -- "$staging_dir"
          else
            chmod 750 "$staging_dir/deploy.sh"
            mv -- "$staging_dir" "$revision_dir"
          fi

          current_link_tmp="$app_dir/.deployment-current-$commit_sha"
          rm -f -- "$current_link_tmp"
          ln -s ".deployment-revisions/$commit_sha" "$current_link_tmp"
          mv -Tf -- "$current_link_tmp" "$app_dir/.deployment-current"
          bash "$app_dir/.deployment-current/deploy.sh" deploy "$commit_sha" --lock-held
          REMOTE
