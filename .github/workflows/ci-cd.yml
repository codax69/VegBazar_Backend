name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vegbazar-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Test and verify image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify production Docker image
        run: docker build --tag vegbazar-backend:ci .

  publish-and-deploy:
    name: Publish and deploy backend
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    concurrency:
      group: vegbazar-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codax69/vegbazar-backend:${{ github.sha }}
            ghcr.io/codax69/vegbazar-backend:latest
      - name: Deploy exact image tag to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" || ! "${VPS_HOST:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_HOST is missing. Add the VPS hostname or IP as a repository secret."
            exit 1
          fi
          if [[ -z "${VPS_USER:-}" || ! "${VPS_USER:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_USER is missing. Add the SSH username as a repository secret (VPS_USERNAME is also accepted for migration)."
            exit 1
          fi
          if [[ -z "${VPS_SSH_KEY:-}" || ! "${VPS_SSH_KEY:-}" =~ [^[:space:]] ]]; then
            echo "::error::VPS_SSH_KEY is missing. Add the SSH private key as a repository secret."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          key_file="$HOME/.ssh/vegbazar_deploy"
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"' EXIT
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H -T 10 "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash /opt/apps/vegbazar/deploy.sh deploy backend $GITHUB_SHA"
