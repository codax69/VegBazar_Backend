services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-codax69}/vegbazar-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG in release.env}
    container_name: vegbazar-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data/invoices:/opt/app/temp
      - ./data/uploads:/opt/app/public/temp
      - ./data/reports:/opt/app/src/temp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
